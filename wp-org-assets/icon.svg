<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1236"/>
      <stop offset="50%" stop-color="#060b24"/>
      <stop offset="100%" stop-color="#030614"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcf33"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#6b8cff"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142154"/>
      <stop offset="100%" stop-color="#08102e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="cyberGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.22)"/>
      <stop offset="60%" stop-color="rgba(107, 140, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)"/>
  <rect width="256" height="256" rx="48" fill="url(#cyberGlow)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="46.5" fill="none" stroke="rgba(150, 175, 255, 0.18)" stroke-width="3"/>

  <!-- Geometric Grid Accent -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="rgba(255, 207, 51, 0.06)" stroke-width="1.5"/>

  <!-- Centered Shield (Scaled from 64x64 to center of 256x256) -->
  <g transform="translate(128, 128) scale(3.1) translate(-32, -32)">
    <!-- Outer Shield Body with Glow -->
    <path d="M32 4L54 12V31C54 45.5 44.5 55.5 32 60C19.5 55.5 10 45.5 10 31V12Z" 
          fill="url(#shieldFill)" 
          stroke="url(#shieldBorder)" 
          stroke-width="3" 
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Circuit Track N -->
    <path d="M22 42V22L42 42V22" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4.2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Glowing Circuit Nodes -->
    <circle cx="22" cy="22" r="4" fill="#ffcf33" stroke="#060b24" stroke-width="1.8"/>
    <circle cx="22" cy="42" r="4" fill="#00f0ff" stroke="#060b24" stroke-width="1.8"/>
    <circle cx="42" cy="42" r="4" fill="#ffcf33" stroke="#060b24" stroke-width="1.8"/>
    <circle cx="42" cy="22" r="4" fill="#00f0ff" stroke="#060b24" stroke-width="1.8"/>
  </g>
</svg>
