<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1200px;
  height: 630px;
  background: radial-gradient(circle at 50% 38%, #14204d 0%, #070c22 60%, #030610 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
  position: relative;
  -webkit-font-smoothing: antialiased;
}

/* Cyber grid */
.grid {
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(rgba(107, 140, 255, 0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(107, 140, 255, 0.08) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* Ambient glow */
.glow-cyan {
  position: absolute;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, transparent 65%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  filter: blur(50px);
}

.glow-gold {
  position: absolute;
  width: 450px;
  height: 450px;
  background: radial-gradient(circle, rgba(255, 207, 51, 0.15) 0%, transparent 60%);
  top: 42%;
  left: 50%;
  transform: translate(-50%, -50%);
  filter: blur(40px);
}

.border-frame {
  position: absolute;
  inset: 12px;
  border: 1.5px solid rgba(0, 240, 255, 0.25);
  border-radius: 16px;
  pointer-events: none;
}

.content-box {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 0 40px;
}

/* The Official Logo from nexaguards.com */
.brand-logo {
  width: 620px;
  height: auto;
  filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 25px rgba(255, 207, 51, 0.35));
}

.tagline {
  margin-top: 42px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #00f0ff;
  text-shadow: 0 0 20px rgba(0, 240, 255, 0.45);
}

.description {
  margin-top: 14px;
  font-size: 19px;
  line-height: 1.45;
  color: #b0c4de;
  max-width: 820px;
}

.pill-bar {
  margin-top: 36px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 12px 36px;
  border-radius: 999px;
  background: rgba(15, 24, 60, 0.9);
  border: 1.5px solid rgba(255, 207, 51, 0.7);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 207, 51, 0.2);
}

.pill-bar span {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #ffcf33;
}
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow-cyan"></div>
<div class="glow-gold"></div>
<div class="border-frame"></div>

<div class="content-box">
  <!-- Official NexaGuard Logo SVG -->
  <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 331.5 64" role="img" aria-label="NexaGuard">
    <defs>
      <linearGradient id="nxga" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffcf33"/>
        <stop offset="1" stop-color="#6b8cff"/>
      </linearGradient>
      <linearGradient id="nxfa" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#15214f"/>
        <stop offset="0" stop-color="#0b1235"/>
      </linearGradient>
      <clipPath id="nxca"><rect x="-2" y="0" width="240" height="20"/></clipPath>
    </defs>
    <!-- Shield -->
    <path d="M32 4L54 12V31C54 45.5 44.5 55.5 32 60C19.5 55.5 10 45.5 10 31V12Z" fill="url(#nxfa)" stroke="url(#nxga)" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M22 42V22L42 42V22" fill="none" stroke="#eaf0ff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="22" r="4.3" fill="#ffcf33" stroke="#0b1235" stroke-width="2.2"/>
    <circle cx="22" cy="42" r="4.3" fill="#ffcf33" stroke="#0b1235" stroke-width="2.2"/>
    <circle cx="42" cy="42" r="4.3" fill="#ffcf33" stroke="#0b1235" stroke-width="2.2"/>
    <circle cx="42" cy="22" r="4.3" fill="#ffcf33" stroke="#0b1235" stroke-width="2.2"/>
    <!-- Typography NEXAGUARD -->
    <g transform="translate(78.0 19.0) scale(1.3)">
      <g clip-path="url(#nxca)">
        <path d="M 2.1 20V 0M 2.1 0L 14.9 20M 14.9 20V 0 M 23.1 0V 20M 21 2.1H 35.5M 21 10H 33.5M 21 17.9H 35.5 M 40 0L 58 20M 58 0L 40 20 M 62 20L 72 0L 82 20M 66.6 14.2H 77.4" fill="none" stroke="#eaf0ff" stroke-width="4.2" stroke-linejoin="miter" stroke-miterlimit="10"/>
        <path d="M 102.05 4.92A 7.9 7.9 0 1 0 103.9 10H 96.5 M 112.1 0V 11A 6.9 6.9 0 0 0 125.9 11V 0 M 132 20L 142 0L 152 20M 136.6 14.2H 147.4 M 158.1 20V 0M 156 2.1H 165.6A 3.9 3.9 0 0 1 165.6 9.9H 158.1M 164 9.9L 171.5 20 M 179.1 0V 20M 177 2.1H 184.6A 7.9 7.9 0 0 1 184.6 17.9H 177" fill="none" stroke="#ffcf33" stroke-width="4.2" stroke-linejoin="miter" stroke-miterlimit="10"/>
      </g>
    </g>
  </svg>

  <div class="tagline">Reparación de Errores · Mantenimiento · Seguridad</div>
  <div class="description">Soporte técnico especializado para WordPress y WooCommerce. Reparación de pantalla blanca, caídas 500, desinfección de malware y mantenimiento preventivo 24/7.</div>

  <div class="pill-bar">
    <span>🛡️ nexaguards.com &nbsp;·&nbsp; Emergencias y Mantenimiento 24/7</span>
  </div>
</div>
</body>
</html>
