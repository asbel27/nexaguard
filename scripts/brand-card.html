<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #060a1d;
    background: radial-gradient(circle at 50% 50%, #0f1c4d 0%, #070c22 65%, #03050e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  /* Cyber Grid */
  .grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(107, 140, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(107, 140, 255, 0.04) 1px, transparent 1px);
    background-size: 30px 30px;
    pointer-events: none;
  }
  /* Center Glow behind shield */
  .glow {
    position: absolute;
    width: 480px;
    height: 480px;
    background: radial-gradient(circle, rgba(0, 240, 255, 0.22) 0%, rgba(255, 207, 51, 0.12) 40%, transparent 70%);
    filter: blur(50px);
    pointer-events: none;
  }
  /* Subtle frame border */
  .border {
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(0, 240, 255, 0.12);
    border-radius: 16px;
    pointer-events: none;
  }
  .logo-box {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-box svg {
    width: 320px;
    height: 320px;
    filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 35px rgba(0, 240, 255, 0.35));
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="border"></div>

  <div class="logo-box">
    <!-- EXACT OFFICIAL NEXAGUARD SHIELD LOGO (logo-mark.svg) -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NexaGuard">
      <defs>
        <linearGradient id="nxga" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ffcf33"/>
          <stop offset="1" stop-color="#6b8cff"/>
        </linearGradient>
        <linearGradient id="nxfa" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#15214f"/>
          <stop offset="1" stop-color="#0b1235"/>
        </linearGradient>
      </defs>
      <path d="M32 4L54 12V31C54 45.5 44.5 55.5 32 60C19.5 55.5 10 45.5 10 31V12Z" fill="url(#nxfa)" stroke="url(#nxga)" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M22 42V22L42 42V22" fill="none" stroke="#eaf0ff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="22" cy="22" r="4.3" fill="#ffcf33" stroke="#0b1235" stroke-width="2.2"/>
      <circle cx="22" cy="42" r="4.3" fill="#ffcf33" stroke="#0b1235" stroke-width="2.2"/>
      <circle cx="42" cy="42" r="4.3" fill="#ffcf33" stroke="#0b1235" stroke-width="2.2"/>
      <circle cx="42" cy="22" r="4.3" fill="#ffcf33" stroke="#0b1235" stroke-width="2.2"/>
    </svg>
  </div>
</body>
</html>
