<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    background: #060a1d;
    background: radial-gradient(circle at 50% 45%, #0f1c4d 0%, #060a1d 70%, #03050f 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    position: relative;
    overflow: hidden;
  }
  /* Cyber Grid overlay */
  .grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(107, 140, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(107, 140, 255, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  /* Subtle ambient glow */
  .glow {
    position: absolute;
    width: 600px;
    height: 350px;
    background: radial-gradient(ellipse at center, rgba(0, 240, 255, 0.15), rgba(255, 207, 51, 0.08) 50%, transparent 75%);
    filter: blur(40px);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    pointer-events: none;
  }
  .card-border {
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(0, 240, 255, 0.18);
    border-radius: 16px;
    pointer-events: none;
  }
  .logo-wrap {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 30px;
  }
  .logo-wrap svg {
    width: 720px;
    height: auto;
    filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 25px rgba(0, 240, 255, 0.25));
  }
  .badge {
    position: relative;
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 28px;
    background: rgba(14, 25, 65, 0.75);
    border: 1px solid rgba(255, 207, 51, 0.4);
    border-radius: 50px;
    color: #eaf0ff;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  }
  .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00f0ff;
    box-shadow: 0 0 10px #00f0ff;
  }
  .badge .gold {
    color: #ffcf33;
  }
  .footer-url {
    position: absolute;
    bottom: 32px;
    color: rgba(160, 185, 230, 0.75);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="card-border"></div>

  <div class="logo-wrap">

  </div>

  <div class="badge">
    <span class="dot"></span>
    <span>Reparación de Errores <span class="gold">·</span> Mantenimiento <span class="gold">·</span> Seguridad WordPress</span>
  </div>

  <div class="footer-url">nexaguards.com · Soporte y Protección 24/7</div>
</body>
</html>
