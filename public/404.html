<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no encontrada (404) | NexaGuard Security</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #070c22;
    --card: #0d1538;
    --border: #1a2554;
    --yellow: #ffcf33;
    --text: #eaf0ff;
    --muted: #8ba5e3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }
  .box {
    max-width: 540px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .code {
    font-size: 5rem;
    font-weight: 800;
    color: var(--yellow);
    line-height: 1;
    margin-bottom: 16px;
    letter-spacing: -2px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 12px; color: #fff; }
  p { color: var(--muted); font-size: 0.98rem; line-height: 1.6; margin-bottom: 28px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--yellow);
    color: #0b1235;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 12px 28px;
    border-radius: 8px;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,207,51,0.35);
  }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La dirección que buscas no existe o ha sido reubicada. Si tu sitio web WordPress tiene problemas de seguridad o necesitas un análisis forense, vuelve a nuestra página principal.</p>
    <a href="/" class="btn">Volver al Inicio</a>
  </div>
</body>
</html>
