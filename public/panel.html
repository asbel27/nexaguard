<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi panel | NexaGuard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230b1235%22/%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%2210%22 y1=%224%22 x2=%2254%22 y2=%2260%22 gradientUnits=%22userSpaceOnUse%22%3E%3Cstop offset=%220%22 stop-color=%22%23ffcf33%22/%3E%3Cstop offset=%221%22 stop-color=%22%236b8cff%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d=%22M32 8L50 14.5V31C50 43 42.5 51.5 32 56C21.5 51.5 14 43 14 31V14.5Z%22 fill=%22%2315214f%22 stroke=%22url(%23g)%22 stroke-width=%223.4%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M24 41V23L40 41V23%22 fill=%22none%22 stroke=%22%23ffcf33%22 stroke-width=%225.4%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070c22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070c22;--bg2:#0d1538;--panel:#101a44;--panel2:#0b1236;--line:rgba(150,175,255,.16);--line2:rgba(170,195,255,.3);--text:#eaf0ff;--muted:#a0acd2;--yellow:#ffcf33;--yellow-ink:#1a1400;--blue:#6b8cff;--red:#ff4560;--green:#3de8a4;--amber:#ffb020;
  --fd:'Unbounded','Segoe UI',system-ui,sans-serif;--fb:'Schibsted Grotesk','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--fm:'JetBrains Mono',ui-monospace,Consolas,monospace;color-scheme:dark}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:16px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;max-width:100vw;width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--fd);font-weight:600;line-height:1.2;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:4px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.7em 1.15em;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:.92rem;transition:transform .15s,background .2s,border-color .2s;white-space:nowrap;line-height:1.2}
.btn-y{background:var(--yellow);color:var(--yellow-ink)}.btn-y:hover{transform:translateY(-1px)}
.btn-o{border-color:var(--line2);background:rgba(255,255,255,.03)}.btn-o:hover{border-color:var(--text)}
.btn-r{border-color:rgba(255,69,96,.5);color:#ff9fb0;background:rgba(255,69,96,.08)}.btn-r:hover{background:rgba(255,69,96,.18)}
.btn.sm{padding:.45em .85em;font-size:.84rem}
.btn[disabled]{opacity:.5;pointer-events:none}
.in,select.in,textarea.in{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:10px;padding:.7em .9em;transition:border-color .2s}
.in:focus{outline:none;border-color:var(--yellow)}
select.in option{background:#0d1538}
textarea.in{resize:vertical;min-height:110px}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>label,.fld>.lb{font-size:.86rem;font-weight:600;color:#cdd6f5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:#cdd6f5;cursor:pointer}
.chk input{margin-top:.3em;accent-color:var(--yellow);width:17px;height:17px;flex:none}
.err{color:#ff8ba0;font-size:.88rem;min-height:1.3em;margin:6px 0}
.hint{color:var(--muted);font-size:.86rem}

/* Login */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-box{width:min(440px,100%);background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:28px;position:relative;overflow:hidden;box-shadow:0 40px 80px -40px #000}
.auth-box::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:repeating-linear-gradient(-45deg,#ffcf33 0 10px,#0b1030 10px 20px)}
.brand{display:flex;align-items:center;margin:8px 0 18px;line-height:0}
.brand svg{height:34px;width:auto;display:block}
.brand .lg-mark{display:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:18px}
.tabs button{padding:.6em;border:1px solid var(--line2);border-radius:10px;background:none;font-weight:700;font-size:.9rem}
.tabs button[aria-selected=true]{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.auth-box h1{font-size:1.25rem;margin-bottom:6px}
.auth-box p.sub{color:var(--muted);font-size:.92rem;margin-bottom:18px}
.back{display:inline-block;margin-top:14px;color:var(--muted);font-size:.88rem;text-decoration:underline;text-underline-offset:3px}

/* Estructura */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh;max-width:100vw;overflow-x:hidden}
.side{position:sticky;top:0;height:100vh;background:var(--panel2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;z-index:30}
.side .brand{margin:0 8px 18px}
.nav-wrap{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;width:100%}
.nav-arr{display:none!important}
.side nav{display:flex;flex-direction:column;gap:6px;width:100%}
.nav-i{display:flex;align-items:center;gap:11px;width:100%;padding:.7em .85em;border-radius:10px;border:0;background:none;text-align:left;color:var(--muted);font-weight:600;font-size:.95rem;transition:background .2s,color .2s}
.nav-i:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav-i[aria-current=page]{background:rgba(255,207,51,.12);color:var(--yellow)}
.nav-i .badge{margin-left:auto;background:var(--red);color:#fff;font-size:.72rem;border-radius:999px;padding:0 .55em;font-weight:800}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.who{padding:0 8px;font-size:.86rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.who b{display:block;color:var(--text);font-size:.95rem}
.main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0;max-width:100%;box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:clamp(1.3rem,2.4vw,1.8rem)}
.top p{color:var(--muted);margin-top:4px}
.grid{display:grid;gap:16px}
.g-dash{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0;max-width:100%;box-sizing:border-box}
.card>h3,.card-h{font-size:1rem;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:grid;gap:16px}
.pill{display:inline-flex;align-items:center;gap:.4em;font-size:.76rem;font-weight:800;padding:.22em .7em;border-radius:999px;border:1px solid var(--line2);white-space:nowrap}
.pill.ok{color:var(--green);border-color:rgba(61,232,164,.5);background:rgba(61,232,164,.08)}
.pill.warn{color:var(--amber);border-color:rgba(255,176,32,.55);background:rgba(255,176,32,.08)}
.pill.crit{color:#ff8ba0;border-color:rgba(255,69,96,.6);background:rgba(255,69,96,.1)}
.pill.info{color:#9fb3ff;border-color:rgba(107,140,255,.55);background:rgba(107,140,255,.09)}
.pill.mute{color:var(--muted)}
.pill.pri{color:var(--yellow-ink);background:var(--yellow);border-color:var(--yellow)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid var(--line2);margin-bottom:16px}
.banner.warn{border-color:rgba(255,176,32,.6);background:rgba(255,176,32,.08)}
.banner.crit{border-color:var(--red);background:rgba(255,69,96,.1)}
.banner.info{border-color:rgba(107,140,255,.6);background:rgba(107,140,255,.08)}
.banner .ic{margin-top:.2em;font-size:1.2em}
.banner div{flex:1}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--fd);font-size:1.6rem;font-weight:600}
.kpi span{color:var(--muted);font-size:.86rem}
.kpi.bad b{color:#ff8ba0}.kpi.good b{color:var(--green)}
.list{list-style:none;display:grid;gap:8px}
.list li{display:flex;gap:10px;align-items:flex-start;font-size:.93rem}
.list .ic{color:var(--green);margin-top:.25em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.93rem}
.kv dt{color:var(--muted)}.kv dd{font-weight:600}
.empty{color:var(--muted);text-align:center;padding:26px 10px;border:1px dashed var(--line2);border-radius:12px;font-size:.93rem}

/* Tablas */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;max-width:100%;width:100%;display:block}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:.75em 1em;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.8rem;background:rgba(255,255,255,.03)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,.04)}
td.wrap{white-space:normal;min-width:180px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.filters .in{width:auto;min-width:160px}

/* Avance del servicio */
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{border:1px solid var(--line2);border-radius:12px;padding:12px;font-size:.86rem;color:var(--muted);position:relative}
.st b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);margin-bottom:8px;font-family:var(--fd);font-size:.8rem}
.st.done{border-color:rgba(61,232,164,.5);color:var(--text)}.st.done b{background:var(--green);color:#032b1a;border-color:var(--green)}
.st.now{border-color:var(--yellow);color:var(--text);background:rgba(255,207,51,.07)}.st.now b{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:8px}

/* Planes */
.plan{display:flex;flex-direction:column;gap:10px}
.plan.cur{border-color:var(--yellow)}
.plan .price{font-family:var(--fd);font-size:1.7rem;font-weight:700}
.plan .price small{font-family:var(--fb);font-size:.85rem;color:var(--muted);font-weight:500;margin-left:6px}

/* Soporte */
.thread{display:grid;gap:12px;margin-bottom:16px}
.msg{max-width:min(640px,92%);padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);white-space:pre-wrap;overflow-wrap:anywhere}
.msg small{display:block;color:var(--muted);font-size:.76rem;margin-bottom:4px}
.msg.me{margin-left:auto;background:rgba(255,207,51,.09);border-color:rgba(255,207,51,.4)}

/* Hallazgos */
.fd{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;background:rgba(255,255,255,.03)}
.fd.crit{border-left-color:var(--red)}.fd.warn{border-left-color:var(--amber)}.fd.info{border-left-color:var(--blue)}.fd.ok{border-left-color:var(--green)}
.fd h4{font-family:var(--fb);font-size:.96rem;font-weight:700;letter-spacing:0;display:flex;gap:10px;align-items:flex-start}
.fd p{color:var(--muted);font-size:.9rem;margin-top:5px;white-space:pre-line;overflow-wrap:anywhere}
.fd code{display:block;margin-top:7px;padding:7px 9px;background:#050a20;border:1px solid var(--line);border-radius:8px;font-family:var(--fm);font-size:.74rem;color:#ff9fb0;white-space:pre-wrap;overflow-wrap:anywhere}
.fd .fix{margin-top:7px;font-size:.88rem;color:#dbe4ff}.fd .fix b{color:var(--yellow)}
.bdg{flex:none;font-size:.66rem;font-weight:800;padding:.2em .55em;border-radius:6px;letter-spacing:.04em;margin-top:.2em}
.bdg.crit{background:var(--red);color:#fff}.bdg.warn{background:var(--amber);color:#1a1200}.bdg.info{background:var(--blue);color:#06112e}.bdg.ok{background:var(--green);color:#032b1a}
details.oks{border:1px dashed var(--line2);border-radius:10px;padding:0 14px}
details.oks summary{cursor:pointer;padding:12px 0;color:var(--muted);font-weight:600}
details.oks .fd{margin-bottom:10px}

/* Análisis en vivo */
.log{font-family:var(--fm);font-size:.76rem;background:#050a20;border:1px solid var(--line);border-radius:10px;padding:12px;height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.log div{flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .c{color:#c8d4ff}.log .i{color:var(--muted)}.log .e{color:#ff8ba0}.log .w{color:var(--amber)}.log .o{color:var(--green)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tile{border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:.78rem;opacity:.55}
.tile small{display:block;color:var(--muted);font-size:.72rem}
.tile[data-s=running]{opacity:1;border-color:var(--yellow)}
.tile[data-s=ok]{opacity:1;border-color:rgba(61,232,164,.6)}.tile[data-s=info]{opacity:1;border-color:rgba(107,140,255,.6)}
.tile[data-s=warn]{opacity:1;border-color:rgba(255,176,32,.7)}.tile[data-s=crit]{opacity:1;border-color:var(--red)}.tile[data-s=skipped]{border-style:dashed}

dialog{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:16px;padding:0;width:min(640px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(3,6,20,.75);backdrop-filter:blur(3px)}
.dlg{padding:22px}
.dlg h3{font-size:1.1rem;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px}
.dlg-x{background:none;border:0;color:var(--muted);font-size:1.4rem;line-height:1}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--text);color:#0a1030;padding:.75em 1.2em;border-radius:12px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.pp-wrap{margin:6px 0}
.pp-box{min-height:44px;max-width:340px}
.tempbox{font-family:var(--fm);font-size:1.15rem;background:#050a20;border:1px dashed var(--yellow);border-radius:10px;padding:14px;text-align:center;letter-spacing:.06em;user-select:all;margin:12px 0}

@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr);display:block;width:100%;max-width:100vw;overflow-x:hidden}
  .side{position:sticky;top:0;height:auto;min-height:56px;flex-direction:row;align-items:center;justify-content:space-between;overflow:hidden;padding:8px 10px;gap:8px;z-index:50;border-right:0;border-bottom:1px solid var(--line2);background:rgba(11,18,54,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .side .brand{margin:0 4px 0 0;flex-shrink:0}
  .side .brand .lg-full{display:none}.side .brand .lg-mark{display:block}.side .brand svg{height:28px}
  @keyframes pulseArrow{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.18);box-shadow:0 0 14px rgba(255,207,51,.7)}}
  .nav-wrap{position:relative;flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;overflow:hidden}
  .nav-wrap::before,.nav-wrap::after{content:"";position:absolute;top:0;bottom:0;width:32px;pointer-events:none;z-index:5;transition:opacity .25s ease;opacity:0}
  .nav-wrap::before{left:0;background:linear-gradient(to right,rgba(11,18,54,.96),transparent)}
  .nav-wrap::after{right:0;background:linear-gradient(to left,rgba(11,18,54,.96),transparent)}
  .nav-wrap.has-left::before{opacity:1}
  .nav-wrap.has-right::after{opacity:1}
  .nav-arr{display:flex!important;align-items:center;justify-content:center;position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:rgba(16,26,68,.96);border:1.5px solid var(--yellow);color:var(--yellow);z-index:10;cursor:pointer;padding:0;box-shadow:0 2px 10px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s,transform .15s,background .2s}
  .nav-arr .ic{width:14px;height:14px;stroke-width:2.5}
  .nav-arr:active{transform:translateY(-50%) scale(.92)}
  .nav-arr-l{left:2px}
  .nav-arr-r{right:2px}
  .nav-wrap.has-left .nav-arr-l{opacity:1;pointer-events:auto}
  .nav-wrap.has-right .nav-arr-r{opacity:1;pointer-events:auto;animation:pulseArrow 2.2s infinite ease-in-out}
  .side nav{display:flex;flex-direction:row;align-items:center;gap:6px;flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:3px 10px 8px;scrollbar-width:thin;scrollbar-color:rgba(255,207,51,.55) rgba(255,255,255,.06)}
  .side nav::-webkit-scrollbar{height:3px;display:block}
  .side nav::-webkit-scrollbar-track{background:rgba(255,255,255,.08);border-radius:999px;margin:0 12px}
  .side nav::-webkit-scrollbar-thumb{background:var(--yellow);border-radius:999px}
  .nav-i{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:auto;flex-shrink:0;white-space:nowrap;padding:7px 11px;border-radius:8px;font-size:.85rem;line-height:1}
  .nav-i .ic{width:18px;height:18px;flex-shrink:0}
  .side-foot{margin:0 0 0 auto;flex-shrink:0;border:0;padding:0;display:flex;align-items:center}
  .side-foot .who{display:none}
  .side-foot .btn{padding:7px 11px;font-size:.82rem;height:34px}
  .g-dash,.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stepper{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:680px){
  .main{padding:18px 14px 60px;max-width:100vw;box-sizing:border-box}
  .top{margin-bottom:16px;gap:12px}
  .g-dash,.g2,.g3,.g4,.row2{grid-template-columns:1fr}
  .card{padding:16px 14px;border-radius:12px}
  .card>h3,.card-h{font-size:.95rem;margin-bottom:12px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .filters{gap:8px}
  .filters .in{width:100%;min-width:0}
  .stepper{grid-template-columns:1fr;gap:6px}
  .st{display:flex;align-items:center;gap:10px;padding:10px 12px}
  .st b{margin-bottom:0;flex-shrink:0}
}
@media (max-width:520px){
  .side{padding:6px 8px;gap:6px}
  .side .brand svg{height:26px}
  .nav-wrap::before,.nav-wrap::after{width:26px}
  .nav-arr{width:22px;height:22px}
  .nav-arr .ic{width:13px;height:13px}
  .nav-arr-l{left:1px}
  .nav-arr-r{right:1px}
  .side nav{padding:3px 6px 7px;gap:4px}
  .nav-i{padding:6px 9px;font-size:.8rem;gap:5px}
  .nav-i span.t{font-size:.8rem}
  .side-foot .btn span.t{display:none}
  .side-foot .btn{padding:6px 9px}
  .main{padding:14px 10px 50px}
  .card{padding:14px 12px}
  .kv{grid-template-columns:1fr;gap:3px}
  .kv dt{font-size:.8rem;margin-top:5px}
  .kv dd{font-size:.92rem;margin-bottom:3px}
  .kpi b{font-size:1.35rem}
  dialog{width:96vw;max-width:96vw}
  .dlg{padding:16px 12px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* ================= Utilidades ================= */

/* ---------- Pago con PayPal desde el panel (para un plan ya pendiente de pago) ---------- */
var ppSdkPromise = null;
function ensurePpSdk() {
  if (!S.paypal) return Promise.reject(new Error('PayPal no está configurado.'));
  if (ppSdkPromise) return ppSdkPromise;
  ppSdkPromise = new Promise(function (resolve, reject) {
    if (window.paypal) return resolve(window.paypal);
    var done = false, s = document.createElement('script');
    s.src = 'https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(S.paypal.clientId) + '&currency=USD&intent=capture';
    s.onload = function () { if (done) return; done = true; window.paypal ? resolve(window.paypal) : reject(new Error('El SDK de PayPal no se inicializó.')); };
    s.onerror = function () { if (done) return; done = true; reject(new Error('No se pudo cargar el módulo de pago de PayPal.')); };
    document.head.appendChild(s);
    setTimeout(function () { if (done) return; done = true; reject(new Error('El módulo de pago tardó demasiado en cargar.')); }, 9000);
  });
  return ppSdkPromise;
}
/* Dibuja el botón de PayPal para pagar `planId` desde el panel del cliente ya identificado. */
function payWithPayPal(container, planId, msgEl) {
  ensurePpSdk().then(function (sdk) {
    if (msgEl) msgEl.remove();
    sdk.Buttons({
      style: { layout: 'horizontal', color: 'gold', shape: 'pill', label: 'paypal', height: 40 },
      createOrder: function () {
        return api('POST', '/api/checkout/paypal/orders', { plan: planId }).then(function (r) { return r.id; })
          .catch(function (e) { toast(e.message); throw e; });
      },
      onApprove: function (data) {
        return api('POST', '/api/checkout/paypal/orders/' + data.orderID + '/capture', {}).then(function () {
          toast('¡Pago recibido! Tu plan ya está activo.'); render();
        }).catch(function (e) { toast(e.message); });
      },
      onError: function () { toast('Hubo un problema con PayPal. Puedes reintentar.'); }
    }).render(container);
  }).catch(function (e) { if (msgEl) msgEl.textContent = e.message + ' Usa el botón de abajo para coordinar el pago por otra vía.'; });
}
function payPalBlock(planId) {
  if (!S.paypal) return null;
  var msg = h('p', { class: 'hint', style: 'margin:10px 0' }, 'Cargando el botón de pago…');
  var box = h('div', { class: 'pp-box' });
  var wrap = h('div', { class: 'pp-wrap' }, msg, box);
  setTimeout(function () { payWithPayPal(box, planId, msg); }, 0);
  return wrap;
}
